<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Nova Mobile</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#202124}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;padding:10px;padding-top:max(10px,env(safe-area-inset-top));z-index:2}.row{display:flex;gap:7px;align-items:center}.icon{width:38px;height:38px;border:0;border-radius:50%;background:#f1f3f4;font-size:19px}.address{flex:1;height:42px;border:0;border-radius:22px;background:#f1f3f4;padding:0 16px;font-size:15px;outline:0}.tabs{display:flex;gap:6px;overflow:auto;padding:8px 2px 2px}.tab{min-width:130px;max-width:180px;padding:10px 12px;border-radius:14px;background:#f1f3f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tab.active{background:#dfe7fd}main{min-height:calc(100vh - 115px);padding:12px}iframe{width:100%;height:calc(100vh - 140px);border:0;border-radius:12px;background:#fff}.home{text-align:center;padding:15vh 15px}.logo{font-size:42px;font-weight:600}.search{width:100%;max-width:650px;height:50px;border:1px solid #dadce0;border-radius:26px;padding:0 20px;font-size:16px}.quick{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.quick button{border:0;border-radius:20px;padding:10px 14px;background:#f1f3f4}</style></head><body><header><div class="row"><button class="icon" id="back">‹</button><button class="icon" id="forward">›</button><input id="address" class="address" placeholder="Search or enter address"><button class="icon" id="go">↵</button><button class="icon" id="menu">⋮</button></div><div id="tabs" class="tabs"></div></header><main id="main"><div class="home"><div class="logo">Nova</div><p>Fast, simple mobile browsing</p><input id="search" class="search" placeholder="Search the web"><div class="quick"><button data-url="https://www.google.com">Google</button><button data-url="https://www.youtube.com">YouTube</button><button data-url="https://github.com">GitHub</button></div></div></main><script>const tabs=[{url:null,title:'New Tab'}];let active=0;const $=id=>document.getElementById(id);function valid(u){return /^https?:\/\//i.test(u)?u:/^[\w.-]+\.[a-z]{2,}/i.test(u)?'https://'+u:'https://www.google.com/search?q='+encodeURIComponent(u)}function renderTabs(){ $('tabs').innerHTML=tabs.map((t,i)=>`<div class="tab ${i===active?'active':''}" data-i="${i}">${t.title||t.url||'New Tab'}</div>`).join('');document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>{active=+e.dataset.i;load()})}function load(){renderTabs();const t=tabs[active];if(!t.url){$('main').innerHTML='<div class="home"><div class="logo">Nova</div><p>Fast, simple mobile browsing</p><input id="search" class="search" placeholder="Search the web"><div class="quick"><button data-url="https://www.google.com">Google</button><button data-url="https://www.youtube.com">YouTube</button><button data-url="https://github.com">GitHub</button></div></div>';bindHome();$('address').value='';return}$('address').value=t.url;$('main').innerHTML='<iframe id="web" sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts" src="'+t.url.replace(/"/g,'&quot;')+'"></iframe>'}function bindHome(){$('search').onkeydown=e=>{if(e.key==='Enter')open(e.target.value)};document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>open(b.dataset.url))}function open(v){const u=valid(v);tabs[active]={url:u,title:u.replace(/^https?:\/\//,'').split('/')[0]};load()}$('go').onclick=()=>open($('address').value);$('address').onkeydown=e=>{if(e.key==='Enter')open(e.target.value)};$('back').onclick=()=>{if(history.length>1)history.back()};$('forward').onclick=()=>history.forward();$('menu').onclick=()=>alert('Nova Mobile\n\nUse the browser menu for Bookmarks, History, Downloads, Extensions and Settings.');bindHome();renderTabs();</script></body></html>
