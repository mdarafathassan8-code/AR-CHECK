name: Nova Chromium Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-chromium/**'
      - 'chromium-integration/**'
      - '.github/workflows/nova-chromium-android.yml'

permissions:
  contents: read

jobs:
  build:
    # Chromium Android is a very large build. Use a self-hosted Linux x64
    # runner with enough disk/RAM for a full Chromium checkout and build.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 720
    env:
      CHROMIUM_DIR: ${{ runner.temp }}/chromium
      OUT_DIR: out/Nova

    steps:
      - name: Checkout Nova integration
        uses: actions/checkout@v4

      - name: Install depot_tools
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -d "$HOME/depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          fi
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Checkout Chromium for Android
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$CHROMIUM_DIR"
          mkdir -p "$CHROMIUM_DIR"
          cd "$CHROMIUM_DIR"
          fetch --nohooks android

      - name: Install Chromium Android dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_DIR/src"
          ./build/install-build-deps.sh --android
          gclient runhooks

      - name: Apply Nova extension integration
        shell: bash
        run: |
          set -euxo pipefail
          "$GITHUB_WORKSPACE/chromium-integration/apply_nova_extension_patch.sh" "$CHROMIUM_DIR/src"

      - name: Configure GN
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_DIR/src"
          mkdir -p "$OUT_DIR"
          cat > "$OUT_DIR/args.gn" <<'EOF'
          target_os = "android"
          target_cpu = "arm64"
          is_component_build = false
          is_debug = false
          symbol_level = 0
          EOF
          gn gen "$OUT_DIR"

      - name: Build Nova APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_DIR/src"
          autoninja -C "$OUT_DIR" chrome_public_apk

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$CHROMIUM_DIR/src/$OUT_DIR" -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          test -n "$(find "$GITHUB_WORKSPACE/artifacts" -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-chromium-android-apk
          path: artifacts/*.apk
          if-no-files-found: error
