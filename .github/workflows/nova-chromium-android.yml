name: Nova Android APK (GitHub Runner)

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-chromium/**'
      - 'mobile/**'
      - 'chromium-integration/**'
      - '.github/workflows/nova-chromium-android.yml'

permissions:
  contents: read

jobs:
  build:
    # Phone-friendly CI: uses a GitHub-hosted Ubuntu runner.
    # This builds the existing Android app project; it does NOT compile the
    # full Chromium source tree (which requires a much larger build machine).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x android-chromium/gradlew

      - name: Build debug APK
        working-directory: android-chromium
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          find android-chromium -type f -name '*.apk' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
          cd artifacts
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-android-debug-apk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
