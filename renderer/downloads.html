<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Downloads</title><style>body{margin:0;font:14px Arial;background:#f8f9fa;color:#202124}.top{padding:22px 28px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}main{max-width:900px;margin:25px auto}.item{background:#fff;margin:10px 0;padding:16px;border-radius:12px;box-shadow:0 1px 4px #0001}.muted{color:#5f6368;font-size:12px}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}</style></head><body><div class="top"><b>Downloads</b><button id="clear">Clear all</button></div><main id="list">Loading…</main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const d=await nova.getDownloads();document.getElementById('list').innerHTML=d.length?d.map(x=>`<div class="item"><b>📄 ${esc(x.name)}</b><div class="muted">${esc(x.path)}</div></div>`).join(''):'<div class="item">No downloads yet.</div>'}document.getElementById('clear').onclick=async()=>{await nova.clearDownloads();load()};load();</script></body></html>
