<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'"><style>body{font-family:Arial;background:#fff;color:#202124;margin:0;padding:8px;width:260px}button{display:block;width:100%;padding:12px;text-align:left;border:0;background:white;border-radius:8px;cursor:pointer}button:hover{background:#f1f3f4}</style></head><body><button id="bm">⭐ Bookmark this page</button><button id="settings">⚙️ Settings</button><button id="hist">🕘 History</button><button id="ext">🧩 Extensions</button><button id="incog">🕶️ New private tab</button><script>document.getElementById('bm').onclick=async()=>{const s=await nova.activeState();if(s)await nova.addBookmark({url:s.url,title:s.title});window.close()};document.getElementById('settings').onclick=()=>nova.newTab('file://'+location.pathname.replace('menu.html','settings.html'));document.getElementById('hist').onclick=()=>nova.newTab('file://'+location.pathname.replace('menu.html','settings.html'));document.getElementById('ext').onclick=()=>nova.installExtension();document.getElementById('incog').onclick=()=>nova.newTab('https://www.google.com');</script></body></html>
