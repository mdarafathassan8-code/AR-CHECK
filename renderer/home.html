<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#202124;min-height:100vh;display:grid;place-items:center}.wrap{text-align:center;width:min(720px,90vw);margin-top:-80px}.logo{font-size:72px;font-weight:500;letter-spacing:-5px;margin-bottom:28px}.logo b:nth-child(1){color:#4285f4}.logo b:nth-child(2){color:#ea4335}.logo b:nth-child(3){color:#fbbc05}.logo b:nth-child(4){color:#4285f4}.logo b:nth-child(5){color:#34a853}.logo b:nth-child(6){color:#ea4335}.search{height:52px;border:1px solid #dfe1e5;border-radius:28px;display:flex;align-items:center;padding:0 18px;box-shadow:0 1px 6px #20212422}.search input{border:0;outline:0;flex:1;font-size:16px}.hint{margin-top:28px;color:#70757a;font-size:13px}</style></head><body><main class="wrap"><div class="logo"><b>N</b><b>o</b><b>v</b><b>a</b></div><form class="search"><span>⌕</span><input autofocus placeholder="Search the web or enter a URL"></form><div class="hint">A fast Chromium-powered browser with tabs and extension support.</div></main><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const v=document.querySelector('input').value.trim();if(v)window.location.href='https://www.google.com/search?q='+encodeURIComponent(v)}</script></body></html>
